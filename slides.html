# Verdikt

**Trustless AI arbitration for on-chain escrow**

Built on Somnia's Agentic L1 · Shannon testnet

**[Live demo → /app](/app/)** · **[Case law → /app/caselaw.html](/app/caselaw.html)**

`github.com/Ridwannurudeen/verdikt`

---

## On-chain escrow can't handle subjective disputes

- Price feeds and parametric rules can't decide *"was the service delivered as described?"*
- A single off-chain bot is a trust hole the size of the operator
- Human juries (Kleros-style) are slow and uneconomical for small claims
- Most teams ship a 2-of-3 multisig and call it done

The dispute committee that on-chain escrow needs **doesn't exist yet**.

---

## Somnia's Agentic L1 makes AI judgment trust-minimized

A subcommittee of validators each runs the same LLM inference.

Consensus is reached on a **byte-identical** result via `allowedValues`.

That is a juror committee.

We turn it into a **settlement layer**.

---

## VerdiktCourt — a reusable AI-jury primitive

`openCase(evidence)` → panel of **5** LLM agents → Majority verdict (`PAYEE` / `PAYER` / `SPLIT`) → 1-hour appeal window → permissionless `finalize`.

- Per-juror chain-of-thought stored off-chain in the agent **receipt**
- Consumer contracts implement `IVerdiktConsumer.onVerdict`
- No admin signer · no fallback path · no human in the settlement loop

---

## The novel layer: stake-backed appeals

The losing party can post a stake and force a re-trial with a **9-agent panel and new evidence**.

- Appeal **upheld** → stake slashed to the counterparty (minus configurable treasury cut)
- Appeal **overturned** → stake returned

New evidence is the honest design.

Deterministic inference doesn't randomly change its mind — **only better facts should**.

---

## N protocols, one court

Six consumers settle on the same court — the court doesn't know what any of them mean:

- `VerdiktEscrow` — two-party deal; appeal stake = 10%
- `VerdiktInsurance` — parametric claims-arbitration pool
- **`VerdiktAgentEscrow`** — machine-native, pull-payment: *agents can't sue each other — now they can*
- **`VerdiktTokenEscrow`** — ERC-20 settlement (agents settle real stablecoin value)
- `VerdiktGrantClawback` — DAO grant clawback · `VerdiktMilestone` — freelance milestone

That reusability is the point: Verdikt is a settlement court any protocol or agent can call.

---

## What ships today

- **11 Solidity contracts** — `VerdiktCourt` + **6 consumers** (Escrow, Insurance, **AgentEscrow**, **TokenEscrow**, GrantClawback, Milestone) on one shared court
- **128/128 tests** — solc 0.8.24, evm_version cancun, incl. invariant + fuzz
- **Agent-to-agent court** — both parties can be contracts; pull-payment settlement; **ERC-20** too
- **Precedent layer** — on-chain, AI-authored, citable case law (`priorCaseId`)
- **Marketplace** of competing courts · **reputation** · **timelock** governance
- Auto-keeper · demo UI · case-law indexer + dashboard · security/economics/portability docs

---

## Live on Shannon

- **Determinism gate: PASS** — a panel of 5 returned **PAYEE 5/5, byte-identical**. The premise the whole design rests on holds.
- **Full stack deployed + exercised** — disputes settled by real AI panels with **no human in the loop** (PAYER and PAYEE outcomes); **4 rulings recorded in the precedent index**; reputation populated on-chain.
- Appeal panel (9 agents) needs ≥9 validators; Shannon caps ~6, so the staked-appeal path is unit-tested and runs live on a larger set.
- Unaudited hackathon code · all addresses in `deployments/shannon.json`.
