# Verdikt

**The settlement court for the agent economy**

Trustless AI arbitration on Somnia's Agentic L1 · Shannon testnet

**[Live → verdikt.gudman.xyz](https://verdikt.gudman.xyz)** · `github.com/Ridwannurudeen/verdikt`

---

## Smart contracts move money. They can't judge.

On-chain escrow works — until two parties disagree.

- *"You didn't deliver." "Yes I did."* — a contract can't weigh evidence
- A single off-chain arbitrator bot is a trust hole the size of its operator
- Human juries are slow and uneconomical for small or machine-speed claims
- **Autonomous agents can pay each other — but they can't sue each other**

The dispute court the agent economy needs **doesn't exist yet.**

---

## Somnia's Agentic L1 makes AI judgment trust-minimized

A subcommittee of validators each runs the **same** LLM inference and must agree on a **byte-identical** result.

That is a juror committee, native to the network — **no external API, no operator key.**

Verdikt turns it into a **settlement layer.**

---

## VerdiktCourt — a reusable AI-jury primitive

`openCase(evidence)` → panel of Somnia validator LLM agents → majority verdict (`PAYER` / `PAYEE` / `SPLIT`) → appeal window → permissionless `finalize`.

- Any contract plugs in via `IVerdiktConsumer.onVerdict` — the court doesn't know what the deal means
- Losing party can **appeal by staking** → a larger panel re-tries with new evidence → stake **slashed** if the verdict holds
- **No admin signer. No fallback path. No human in the settlement loop.**

---

## Agent-first, end-to-end

In the **Agent Arena**, two autonomous agents transact, dispute, and settle with **no human and no EOA in the settlement path.**

- The buyer agent files · the court convenes the jury · the verdict settles the funds · a keeper finalizes it
- The same court powers a two-party escrow (two-sided evidence) and a **ServiceSLA** arbiter in ~60 lines

**Judgment-as-an-oracle** for the machine economy.

---

<!-- .slide: class="dense" -->

## Why an LLM verdict is safe to settle money on

- **Determinism** — proven live: 5-agent panels agree byte-for-byte
- **Verifiable evidence** — attested oracle facts outrank unverified claims
- **Injection-resistant** — proven live; embedded instructions are ignored
- **Model + prompt pinning** — every verdict is auditable to what decided it
- **Abstention** — thin evidence → `UNDECIDABLE` + a safe-default refund
- **Resilient panels** — degrade to the largest jury available; never stall

---

## Proven live on Shannon

- **Determinism gate: PASS** — byte-identical panel consensus, the premise the whole design rests on
- **92% agreement** with human-expected verdicts · **100% byte-identical** convergence — 12-case benchmark
- **Real settlements on-chain** — disputes filed, judged, and finalized with no human; a precedent ledger of real rulings
- **0 successful prompt injections**

Everything is live and reading real on-chain data at **verdikt.gudman.xyz**.

---

## One court, many protocols

Consumers settle on the same shared court:

- `VerdiktEscrow` — two-party deal, two-sided evidence
- **`VerdiktAgentEscrow`** — pull-payment, agent-to-agent
- **`VerdiktTokenEscrow`** — ERC-20 (agents settle real token value)
- **`ServiceSLA`** — SLA-breach arbiter · `VerdiktGrantClawback` · `VerdiktMilestone`

Plus an on-chain **precedent ledger**, reputation, a marketplace, and timelock governance.

---

## What ships today

- `VerdiktCourt` + a family of consumers on **one shared court**
- **230 passing tests** — Solidity 0.8.24 (cancun), Foundry, incl. invariant + fuzz
- **Auto-finalize keeper** running in production (systemd) — nothing waits on a human
- **Full live product** — Agent Arena, Courtroom replay, Explorer, Case-law ledger, Analytics, interactive demo
- Live premium stack on Shannon (chain 50312) · addresses in `deployments/shannon.json`

---

## Status & roadmap

**Live on testnet** as a reference deployment — real on-chain activity, honest about what's next:

- No third-party audit yet — audit-readiness + bug-bounty scaffolding are in the repo
- ~92% accuracy on a small benchmark — escalating stake-backed appeals + a human-escalation path for high-value disputes
- **Next:** external audit → mainnet → real integrators
