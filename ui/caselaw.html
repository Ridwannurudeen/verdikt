<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verdikt — case law</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #06070c; --surface: #11131e; --surface-2: #161927;
        --border: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.15);
        --text: #f6f7fc; --muted: #9fa2ba; --dim: #6a6e87;
        --violet: #8b5cf6; --amber: #f5a524; --green: #2ea043;
        --grad: linear-gradient(120deg, #818cf8, #a78bfa 52%, #c084fc);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; position: relative; }
      body::before { content: ""; position: fixed; inset: 0; z-index: -2; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 34px 34px; -webkit-mask-image: radial-gradient(120% 70% at 50% 0%, #000 20%, transparent 70%); mask-image: radial-gradient(120% 70% at 50% 0%, #000 20%, transparent 70%); }
      body::after { content: ""; position: fixed; top: -340px; left: 50%; transform: translateX(-50%); width: 900px; height: 600px; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, rgba(124,92,246,0.24), transparent 70%); }
      a { color: #b9c2ff; text-decoration: none; } a:hover { text-decoration: underline; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }
      .muted { color: var(--muted); }
      svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; display: block; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

      nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px); background: rgba(6,7,12,0.7); border-bottom: 1px solid var(--border); }
      .nav-in { max-width: 1160px; margin: 0 auto; padding: 0 22px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; }
      .brand .logo { width: 27px; height: 27px; border-radius: 8px; background: linear-gradient(140deg, rgba(129,140,248,0.25), rgba(192,132,252,0.18)); border: 1px solid rgba(167,139,250,0.4); display: grid; place-items: center; color: #c4b5fd; font-size: 15px; }
      .nav-links { display: flex; gap: 22px; align-items: center; font-size: 14px; }
      .nav-links a { color: var(--muted); }
      .nav-links a.active { color: var(--text); }
      .nav-links a:hover { color: var(--text); text-decoration: none; }

      .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-top: 14px; }
      .panel.header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 40px; }
      h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
      .conn-info { font-size: 12px; color: var(--dim); }
      .panel h2 { font-size: 12px; margin: 0 0 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
      .hist { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
      .empty { color: var(--muted); padding: 6px 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; }
      th { color: var(--dim); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }
      .badge { display: inline-block; padding: 2px 9px; border-radius: 100px; font-size: 11px; font-weight: 800; }
      .PAYEE { background: rgba(46,160,67,0.18); color: #6ee7a0; } .PAYER { background: rgba(139,92,246,0.18); color: #c4b5fd; }
      .SPLIT { background: rgba(245,165,36,0.16); color: #ffd687; } .UNDECIDABLE { background: rgba(120,128,150,0.2); color: #c6cbe0; } .NONE { background: var(--surface-2); color: var(--dim); }
      .yes { background: rgba(46,160,67,0.18); color: #6ee7a0; } .no { background: var(--surface-2); color: var(--dim); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="i-scale" viewBox="0 0 24 24"><path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></symbol>
    </defs></svg>

    <nav>
      <div class="nav-in">
        <a class="brand" href="/"><span class="logo"><svg class="i"><use href="#i-scale"/></svg></span> Verdikt</a>
        <div class="nav-links">
          <a href="./">Demo</a>
          <a href="courtroom.html">Courtroom</a>
          <a href="explorer.html">Explorer</a>
          <a class="active" href="caselaw.html">Case law</a>
          <a href="/">Home ↗</a>
        </div>
      </div>
    </nav>

    <div class="wrap">
      <div class="panel header">
        <h1>Case law</h1>
        <span id="meta" class="conn-info">loading caselaw.json…</span>
      </div>

      <div class="panel">
        <h2>Overview</h2>
        <div id="summary" class="muted">—</div>
        <div id="hist" class="hist"></div>
      </div>

      <div class="panel" style="margin-bottom: 50px;">
        <h2>Rulings</h2>
        <div id="tableWrap">
          <div class="empty">loading…</div>
        </div>
      </div>
    </div>

    <script type="module">
      const VERDICTS = ["PAYEE", "PAYER", "SPLIT", "NONE"];

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function badge(label, cls) {
        return `<span class="badge ${esc(cls ?? label)}">${esc(label)}</span>`;
      }

      function fmtTime(unix) {
        if (!unix) return "—";
        return new Date(Number(unix) * 1000).toLocaleString();
      }

      function receiptCell(receiptId) {
        if (!receiptId || receiptId === "0") return "—";
        const url = `https://agents.somnia.network/receipts/${encodeURIComponent(receiptId)}`;
        return `${esc(receiptId)} · <a href="${url}" target="_blank" rel="noopener">View receipt</a>`;
      }

      function render(rulings) {
        $("meta").textContent =
          `${rulings.length} ruling${rulings.length === 1 ? "" : "s"}`;

        const finalized = rulings.filter((r) => r.finalized).length;
        const appealed = rulings.filter((r) => r.appealed).length;
        $("summary").textContent =
          `total cases: ${rulings.length} · finalized: ${finalized} · appealed: ${appealed}`;

        const hist = {};
        for (const r of rulings) {
          const v = r.verdict ?? "NONE";
          hist[v] = (hist[v] ?? 0) + 1;
        }
        const order = [
          ...VERDICTS,
          ...Object.keys(hist).filter((k) => !VERDICTS.includes(k)),
        ];
        $("hist").innerHTML = order
          .filter((v) => hist[v])
          .map((v) => `${badge(v)} <span class="muted">${hist[v]}</span>`)
          .join("&nbsp;&nbsp;");

        if (rulings.length === 0) {
          $("tableWrap").innerHTML =
            `<div class="empty">no rulings in snapshot.</div>`;
          return;
        }

        const rows = rulings
          .map(
            (r) => `
    <tr>
      <td>${esc(r.caseId)}</td>
      <td>${badge(r.verdict ?? "NONE")}${r.verdict === "SPLIT" && r.payeeBps != null ? ` <span class="muted">${r.payeeBps / 100}% payee</span>` : ""}</td>
      <td>${esc(r.round ?? "—")}</td>
      <td>${esc(r.status ?? "—")}</td>
      <td>${badge(r.appealed ? "yes" : "no", r.appealed ? "yes" : "no")}</td>
      <td>${badge(r.finalized ? "yes" : "no", r.finalized ? "yes" : "no")}</td>
      <td class="mono">${esc(r.consumer ?? "—")}</td>
      <td>${esc(r.escrowRef ?? "—")}</td>
      <td>${fmtTime(r.rulingTime)}</td>
      <td class="mono">${receiptCell(r.receiptId)}</td>
    </tr>`,
          )
          .join("");

        $("tableWrap").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Case</th><th>Verdict</th><th>Round</th><th>Status</th>
          <th>Appealed</th><th>Finalized</th><th>Consumer</th>
          <th>Escrow ref</th><th>Ruling time</th><th>Receipt</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
      }

      async function load() {
        try {
          const res = await fetch("caselaw.json", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!Array.isArray(data))
            throw new Error("caselaw.json is not an array");
          render(data);
        } catch (e) {
          $("meta").textContent = "failed to load caselaw.json";
          $("summary").textContent = "";
          $("tableWrap").innerHTML =
            `<div class="empty">Could not load <code>caselaw.json</code> from this directory ` +
            `(${esc(e.message)}). Run the indexer (<code>npm run index</code>) to generate it, ` +
            `then serve this folder over HTTP.</div>`;
        }
      }

      load();
    </script>
  </body>
</html>
