<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verdikt — the courtroom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #06070c; --surface: #11131e; --surface-2: #161927;
        --border: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.15);
        --text: #f6f7fc; --muted: #9fa2ba; --dim: #6a6e87;
        --violet: #8b5cf6; --amber: #f5a524; --green: #2ea043;
        --grad: linear-gradient(120deg, #818cf8, #a78bfa 52%, #c084fc);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; position: relative; }
      body::before { content: ""; position: fixed; inset: 0; z-index: -2; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 34px 34px; -webkit-mask-image: radial-gradient(120% 70% at 50% 0%, #000 20%, transparent 70%); mask-image: radial-gradient(120% 70% at 50% 0%, #000 20%, transparent 70%); }
      body::after { content: ""; position: fixed; top: -340px; left: 50%; transform: translateX(-50%); width: 900px; height: 600px; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, rgba(124,92,246,0.28), transparent 70%); }
      a { color: #b9c2ff; text-decoration: none; } a:hover { text-decoration: underline; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; display: block; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 22px; }
      .muted { color: var(--muted); }

      nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px); background: rgba(6,7,12,0.7); border-bottom: 1px solid var(--border); }
      .nav-in { max-width: 1160px; margin: 0 auto; padding: 0 22px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; }
      .brand .logo { width: 27px; height: 27px; border-radius: 8px; background: linear-gradient(140deg, rgba(129,140,248,0.25), rgba(192,132,252,0.18)); border: 1px solid rgba(167,139,250,0.4); display: grid; place-items: center; color: #c4b5fd; font-size: 15px; }
      .nav-links { display: flex; gap: 22px; align-items: center; font-size: 14px; }
      .nav-links a { color: var(--muted); }
      .nav-links a.active { color: var(--text); }
      .nav-links a:hover { color: var(--text); text-decoration: none; }

      .head { padding: 40px 0 8px; }
      h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
      .head p { color: var(--muted); margin: 8px 0 0; }
      .cfg { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 13px; color: var(--dim); }
      input { background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13px; }
      .btn { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; border-radius: 9px; padding: 8px 15px; border: 0; cursor: pointer; background: var(--grad); color: #15102b; }
      .btn:hover { transform: translateY(-1px); }
      #status { font-size: 12px; color: var(--dim); }

      /* timeline */
      #stage { margin-bottom: 60px; }
      .step { display: flex; gap: 16px; }
      .rail { display: flex; flex-direction: column; align-items: center; }
      .dot { width: 38px; height: 38px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--dim); flex: 0 0 auto; transition: all 0.3s; }
      .dot svg.i { width: 18px; height: 18px; }
      .dot.on { background: linear-gradient(140deg, rgba(129,140,248,0.28), rgba(192,132,252,0.18)); border-color: rgba(167,139,250,0.5); color: #c4b5fd; }
      .line { width: 2px; flex: 1; background: linear-gradient(var(--border), var(--border)); margin: 4px 0; min-height: 20px; }
      .body { padding-bottom: 26px; flex: 1; padding-top: 7px; }
      .body h3 { margin: 0 0 8px; font-size: 15.5px; font-weight: 700; }
      .quote { background: var(--surface); border-left: 3px solid var(--green); border-radius: 0 10px 10px 0; padding: 11px 14px; color: #cdd3e6; white-space: pre-wrap; font-size: 13.5px; }
      .law { background: var(--surface); border: 1px dashed var(--border-2); border-radius: 10px; padding: 11px 14px; color: var(--muted); font-size: 12.5px; font-family: "JetBrains Mono", monospace; line-height: 1.65; }
      .badge { display: inline-block; padding: 3px 12px; border-radius: 100px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em; }
      .badge.big { font-size: 15px; padding: 5px 15px; }
      .PAYEE { background: rgba(46,160,67,0.18); color: #6ee7a0; border: 1px solid rgba(46,160,67,0.4); }
      .PAYER { background: rgba(139,92,246,0.18); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.4); }
      .SPLIT { background: rgba(245,165,36,0.16); color: #ffd687; border: 1px solid rgba(245,165,36,0.4); }
      .UNDECIDABLE { background: rgba(120,128,150,0.2); color: #c6cbe0; border: 1px solid var(--border-2); }
      .NONE { background: var(--surface-2); color: var(--dim); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="i-scale" viewBox="0 0 24 24"><path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
      <symbol id="i-circlecheck" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></symbol>
    </defs></svg>

    <nav>
      <div class="nav-in">
        <a class="brand" href="/"><span class="logo"><svg class="i"><use href="#i-scale"/></svg></span> Verdikt</a>
        <div class="nav-links">
          <a href="./">Demo</a>
          <a class="active" href="courtroom.html">Courtroom</a>
          <a href="explorer.html">Explorer</a>
          <a href="caselaw.html">Case law</a>
          <a href="/">Home ↗</a>
        </div>
      </div>
    </nav>

    <div class="wrap">
      <div class="head">
        <h1>The Verdikt courtroom</h1>
        <p>Watch a dispute decided by the on-chain AI jury — replayed live from Somnia Shannon.</p>
      </div>
      <div class="cfg">
        court <input id="court" /> case # <input id="case" style="width:62px" />
        <button class="btn" id="go"><svg class="i" style="width:14px;height:14px"><use href="#i-play"/></svg> replay</button>
        <span id="status" style="margin-left:auto"></span>
      </div>
      <div id="stage"></div>
    </div>

    <script type="module">
      import { createPublicClient, http, parseAbi } from "https://esm.sh/viem@2.21.0";

      const RPC = "https://api.infra.testnet.somnia.network/";
      const DEFAULT_COURT = "0x8f2a01D63D3fC0216321970510D0dDFFe9693199"; // v4
      const EXP = "https://shannon-explorer.somnia.network/address/";
      const VERDICT = ["NONE", "PAYEE", "PAYER", "SPLIT", "UNDECIDABLE"];
      const STATUS = ["None", "Pending", "Ruled", "Final", "Errored"];
      const WIN = { PAYEE: "the payee / seller", PAYER: "the payer / buyer", SPLIT: "a split", UNDECIDABLE: "no one (abstained)" };

      const COURT_ABI = parseAbi([
        "function getCase(uint256) view returns ((address consumer,uint256 escrowRef,uint8 round,uint8 status,uint8 verdict,uint256 receiptId,uint64 rulingTime))",
        "function splitBps(uint256) view returns (uint16)",
        "function promptVersionOf(uint256) view returns (uint256)",
        "function promptVersion(uint256) view returns ((string system,string preamble,string instructionNonGraded,string instructionGraded,bool exists))",
        "function appealDeadlineOf(uint256) view returns (uint64)",
        "function attestationRegistry() view returns (address)",
      ]);
      const ATT_ABI = parseAbi([
        "function subjectFor(address,uint256) view returns (bytes32)",
        "function factsFor(bytes32) view returns (string)",
      ]);

      const $ = (id) => document.getElementById(id);
      const client = createPublicClient({ transport: http(RPC) });
      const short = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
      const court = () => $("court").value.trim();
      const read = (fn, args = []) => client.readContract({ address: court(), abi: COURT_ABI, functionName: fn, args });

      function step(iconId, on, title, html, last) {
        return `<div class="step">
          <div class="rail"><div class="dot ${on ? "on" : ""}"><svg class="i"><use href="#${iconId}"/></svg></div>${last ? "" : '<div class="line"></div>'}</div>
          <div class="body"><h3>${title}</h3>${html}</div></div>`;
      }

      async function replay() {
        const id = BigInt($("case").value || "1");
        $("status").textContent = "reading the record…";
        $("stage").innerHTML = "";
        let c;
        try { c = await read("getCase", [id]); } catch (e) { $("status").textContent = "error: " + (e.shortMessage ?? e.message); return; }
        if (c.consumer === "0x0000000000000000000000000000000000000000") { $("status").textContent = "no such case"; return; }

        const verdict = VERDICT[c.verdict] ?? "NONE";
        const status = STATUS[c.status] ?? "?";
        const ruled = c.status >= 2;
        const final = c.status === 3;

        let facts = "";
        try {
          const reg = await read("attestationRegistry");
          if (reg !== "0x0000000000000000000000000000000000000000") {
            const subject = await client.readContract({ address: reg, abi: ATT_ABI, functionName: "subjectFor", args: [c.consumer, c.escrowRef] });
            facts = await client.readContract({ address: reg, abi: ATT_ABI, functionName: "factsFor", args: [subject] });
          }
        } catch {}

        let sys = "";
        try {
          const pv = await read("promptVersionOf", [id]);
          const v = await read("promptVersion", [pv]);
          sys = `prompt v${pv}: ${v.system}`;
        } catch {}

        let verdictHtml = `<span class="muted">awaiting the panel…</span>`;
        if (ruled) {
          let pct = "";
          if (verdict === "SPLIT") { try { const bps = await read("splitBps", [id]); pct = ` — <b>${Number(bps) / 100}% to the payee</b>`; } catch {} }
          verdictHtml = `<span class="badge ${verdict} big">${verdict}</span>${pct}
            <div class="muted" style="margin-top:8px">In favor of ${WIN[verdict] ?? "?"} · ${c.round == 0 ? "trial panel (5)" : "appeal panel (9)"}</div>`;
        }

        const receipt = c.receiptId > 0n
          ? `<a href="https://agents.somnia.network/receipts/${c.receiptId}" target="_blank">receipt #${c.receiptId} — the jurors' reasoning ↗</a>`
          : `<span class="muted">on-chain receipt attaches when the panel returns</span>`;

        $("stage").innerHTML = [
          step("i-scale", true, "A dispute is opened",
            `Case <b>#${id}</b> · consumer <a href="${EXP}${c.consumer}" target="_blank">${short(c.consumer)}</a> · reference ${c.escrowRef}`),
          step("i-link", facts.length > 0, "Evidence entered into the record",
            facts.length > 0 ? `<div class="quote">${facts.replace(/</g, "&lt;")}</div>`
              : `<span class="muted">No attested facts on file — decided on the parties' submitted evidence (see the receipt).</span>`),
          step("i-scroll", true, "Tried under the court's law",
            `<div class="law">${(sys || "(prompt unavailable)").replace(/</g, "&lt;")}</div>`),
          step("i-users", ruled, "The panel rules", verdictHtml),
          step("i-file", c.receiptId > 0n, "The reasoning is recorded", receipt),
          step(final ? "i-circlecheck" : "i-clock", true, final ? "Final & settled" : `Status: ${status}`,
            final ? `<span class="muted">The verdict was delivered to the consumer and the funds settled — no human in the loop.</span>`
                  : `<span class="muted">${status}${ruled && !final ? " · appeal window open" : ""}</span>`, true),
        ].join("");
        $("status").textContent = "replayed live ✓";
      }

      $("court").value = DEFAULT_COURT;
      $("case").value = "1";
      $("go").onclick = replay;
      replay();
    </script>
  </body>
</html>
