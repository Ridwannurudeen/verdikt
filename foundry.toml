[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Somnia EVM target version is unconfirmed; "paris" is the safe lowest-common-denominator
# (no PUSH0 / transient storage). Bump to "shanghai"/"cancun" once confirmed on Shannon.
evm_version = "paris"

[rpc_endpoints]
shannon = "${SHANNON_RPC}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
