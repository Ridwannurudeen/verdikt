[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Shannon supports Cancun opcodes (PUSH0/MCOPY/TLOAD/TSTORE), verified live on-chain (2026-05-31).
# NOTE: the Shannon explorer's contract verification defaults to "paris" — set the matching
# evm_version when verifying or verification will fail.
evm_version = "cancun"

[rpc_endpoints]
shannon = "${SHANNON_RPC}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
