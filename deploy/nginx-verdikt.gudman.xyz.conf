# Verdikt landing — trustless AI arbitration for on-chain escrow on Somnia
# Domain: verdikt.gudman.xyz
# Site:   /opt/verdikt/web/         (DECK.html as index, demo UI under /app/)
#
# Install:
#   sudo cp nginx-verdikt.gudman.xyz.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/nginx-verdikt.gudman.xyz.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /opt/verdikt/web -d verdikt.gudman.xyz
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name verdikt.gudman.xyz;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verdikt.gudman.xyz;

    ssl_certificate /etc/letsencrypt/live/verdikt.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verdikt.gudman.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.infra.testnet.somnia.network https://dream-rpc.somnia.network https://agents.somnia.network https://shannon-explorer.somnia.network; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /opt/verdikt/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
